"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 50
command_timeout = 50

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$golang\
$java\
$python\
$rust\
$lua\
$cmd_duration\
$status\
$line_break$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bold blue"

[os.symbols]
Arch = "󰣇"

[username]
show_always = true
style_user = "bold lavender"
style_root = "bold red"
format = '[ $user ]($style)'

[directory]
style = "bold peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"developer" = "󰲋 "
"Videos" = " "
".config" = " "
"codes" = "󰘦 "
".cache" = " "
"hypr" = " "
"nvim" = " "
"dwm" = " "
"tmux" = " "
"minecraft" = "󰍳 "
"assembly" = " "
"c#" = "󰌛 "
"crystal" = " "
"dart" = " "
"fortran" = "󱈚 "
"go" = " "
"haskell" = " "
"java" = " "
"julia" = " "
"kotlin" = " "
"lua" = " "
"nim" = " "
"perl" = " "
"php" = " "
"python" = " "
"ruby" = " "
"rust" = " "
"swift" = " "
"vedic" = "󰥳 "
"verilog" = "󰍛 "
"zig" = " "
"Bliss" = "󰳩 "
"Mashup" = "󰽰 "
"Peace" = "󰔟 "
"Playlist" = "󰲸 "
"Kicad" = " "
"virtual-machines" = "󰒒 "

[git_branch]
symbol = ""
style = "bold purple"
format = '[ $symbol $branch ]($style)'
only_attached = true
truncation_length = 30

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind ]($style)'
ignore_submodules = true

[c]
symbol = " "
style = "blue"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ""
style = "cyan"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "red"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "sapphire"
format = '[ $symbol( $version) (\($virtualenv\)) ]($style)'
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt"]
detect_folders = []

[lua]
symbol = " "
style = "blue"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = " "
style = "red"
format = '[ $symbol( $version) ]($style)'

[cmd_duration]
min_time = 0
style = "bold yellow"
format = "[ took $duration ]($style)"
show_milliseconds = true

[status]
disabled = false
style = "bold red"
symbol = "✖ "
format = '[$symbol$status]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
